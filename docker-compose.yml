# Fixed so moving or renaming the checkout keeps the same containers and volumes.
name: ai-power-atlas

x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: ai-power-atlas-airflow:local
  environment:
    # Read by the atlas CLI that tasks run. Airflow itself needs none of these.
    EIA_API_KEY: ${EIA_API_KEY}
    CENSUS_API_KEY: ${CENSUS_API_KEY:-}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_ENDPOINT: minio:9000
    MLFLOW_TRACKING_URI: http://mlflow:5000
    ATLAS_LAKE_ROOT: s3://atlas-lake
    ATLAS_WAREHOUSE: /opt/atlas/project/data/atlas.duckdb
    # The checkout's owner differs from the container user, and git refuses that by default.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: /opt/atlas/project
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://atlas:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    # Webserver died after 11 minutes on an 8 GB laptop: gunicorn missed its 120 s heartbeat.
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: "0"
  restart: unless-stopped
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs/airflow:/opt/airflow/logs
    # The whole checkout, so tasks run the code and dbt project as committed and write figures back.
    - .:/opt/atlas/project
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/create-mlflow-db.sh:/docker-entrypoint-initdb.d/create-mlflow-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # minio/minio is gone from Docker Hub and the upstream repo is archived. See docs/log.md.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: atlas-lake,mlflow
    # Loopback only: the local passwords in .env.example must not reach the network.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow
    restart: "no"
    command: >
      bash -c "airflow db migrate && airflow users create --username admin --password
      ${AIRFLOW_ADMIN_PASSWORD} --firstname Local --lastname Admin --role Admin
      --email admin@example.org"

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 30

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 15s
      timeout: 15s
      retries: 20

  mlflow:
    build: docker/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri postgresql+psycopg2://atlas:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
    environment:
      # MLflow rejects other Host headers, and Airflow tasks reach it by its service name.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:5001,127.0.0.1:5001"
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      # macOS AirPlay Receiver holds port 5000 on the host and answers 403.
      - "127.0.0.1:5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
