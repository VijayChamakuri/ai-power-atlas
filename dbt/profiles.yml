atlas:
  target: lake
  outputs:
    # The frozen lake in MinIO. Credentials come from .env, never from this file.
    lake:
      type: duckdb
      path: "{{ env_var('ATLAS_WAREHOUSE', 'data/atlas.duckdb') }}"
      threads: 2
      extensions: [httpfs]
      settings:
        s3_endpoint: "{{ env_var('MINIO_ENDPOINT', 'localhost:9000') }}"
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER', '') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD', '') }}"
        s3_region: us-east-1
        s3_use_ssl: false
        s3_url_style: path
    # A real slice of the lake in tests/fixtures/lake, so CI runs without MinIO.
    fixture:
      type: duckdb
      path: data/fixture.duckdb
      threads: 2
